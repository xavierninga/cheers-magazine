<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sound Lab — Cheers Dev</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/pages.css"/>
  <style>
    .sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
    .sound-card{background:var(--gray);border:1px solid var(--gray-mid);border-radius:6px;padding:1.1rem;transition:border-color .2s}
    .sound-card.playing{border-color:var(--red);background:rgba(200,16,46,.07)}
    .sound-cat{font-family:var(--font-m);font-size:.58rem;color:var(--red);margin-bottom:4px;letter-spacing:.1em}
    .sound-name{font-weight:600;font-size:.95rem;margin-bottom:3px}
    .sound-desc{font-size:.75rem;opacity:.42;margin-bottom:.9rem;line-height:1.5}
    .play-btn{width:100%;padding:.44rem;border:1px solid rgba(200,16,46,.38);color:var(--red);background:transparent;border-radius:3px;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-b);cursor:pointer;transition:background .15s,color .15s}
    .play-btn:hover,.play-btn.playing{background:var(--red);color:#fff}
  </style>
</head>
<body>
<div class="dev-topbar">
  <a href="index.html">← Dev Hub</a><span class="sep">|</span>
  <h1>🎵 Sound Lab</h1>
  <span class="dev-env-badge">DEV TOOL</span>
</div>
<div class="dev-wrap">
  <!-- Controls -->
  <div class="dev-card" style="margin-bottom:1.5rem">
    <p class="dev-section-title">Master Controls</p>
    <div style="display:flex;gap:2rem;align-items:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.8rem">
        <span style="font-size:.8rem;opacity:.5">Volume:</span>
        <input type="range" min="0" max="1" step="0.05" value="0.7" id="volSlider" style="width:140px;accent-color:var(--red)"/>
        <span id="volLabel" style="font-family:var(--font-m);font-size:.75rem;color:var(--red);min-width:38px">70%</span>
      </div>
      <button id="btnMuteAll" class="btn btn-outline btn-sm">🔊 Mute All</button>
      <span style="font-family:var(--font-m);font-size:.7rem;opacity:.38">Last played: <span id="lastPlayed">—</span></span>
    </div>
  </div>
  <!-- Category filters -->
  <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap" id="catFilters"></div>
  <!-- Sound grid -->
  <div class="sound-grid" id="soundGrid"></div>
  <!-- Note -->
  <div style="margin-top:1.5rem;background:#0d0d0d;border:1px solid rgba(200,16,46,.18);border-radius:6px;padding:1rem">
    <p style="font-size:.78rem;opacity:.5;line-height:1.65">
      <strong style="color:var(--red)">📌 Note:</strong>
      These buttons play synthesised preview tones generated by the Web Audio API.
      To use real sounds, add MP3 files to <code style="font-family:var(--font-m)">/sounds/&lt;category&gt;/filename.mp3</code>
      and update the <code style="font-family:var(--font-m)">path</code> in the SOUNDS array below.
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
<script>
const SOUNDS = [
  {id:'page-flip-soft', cat:'page-flip',   label:'Page Flip Soft',        desc:'Light paper magazine turn',        freq:2100, decay:22},
  {id:'page-flip-hard', cat:'page-flip',   label:'Page Flip Hard',        desc:'Crisp glossy heavy paper turn',    freq:2600, decay:18},
  {id:'page-flip-quick',cat:'page-flip',   label:'Page Flip Quick',       desc:'Fast mobile swipe turn',           freq:2400, decay:28},
  {id:'luxury-hover',   cat:'hover',       label:'Luxury Hover',          desc:'Subtle premium hover tone',        freq:1200, decay:40},
  {id:'nav-hover',      cat:'hover',       label:'Nav Hover',             desc:'Light navigation hover',           freq:1000, decay:45},
  {id:'premium-click',  cat:'click',       label:'Premium Click',         desc:'Satisfying button click',          freq:2200, decay:35},
  {id:'nav-click',      cat:'click',       label:'Nav Click',             desc:'Clean navigation click',           freq:1800, decay:38},
  {id:'cinematic-trans',cat:'transition',  label:'Cinematic Transition',  desc:'Dramatic section change',          freq: 600, decay:12},
  {id:'smooth-trans',   cat:'transition',  label:'Smooth Transition',     desc:'Minimal UI transition',            freq: 900, decay:18},
  {id:'success-notif',  cat:'notification',label:'Success',               desc:'Success chime',                    freq:1600, decay:20},
  {id:'error-notif',    cat:'notification',label:'Error',                 desc:'Error state sound',                freq: 400, decay:15},
  {id:'magazine-open',  cat:'immersive',   label:'Magazine Open',         desc:'Immersive opening experience',     freq: 800, decay:10},
  {id:'ambient-reader', cat:'immersive',   label:'Reader Ambient',        desc:'Soft ambient reading loop',        freq: 300, decay: 8},
];
const CATS = [...new Set(SOUNDS.map(s=>s.cat))];
let muted=false, vol=0.7, activeCat='all', actx=null;
function getAC(){ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)(); return actx; }
function playSynth(s){
  if(muted||!FeatureFlags.get('sounds')) return;
  try{
    const ctx=getAC(), len=Math.floor(ctx.sampleRate*0.2), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.exp(-(i/ctx.sampleRate)*s.decay)*(Math.random()*2-1)*0.5*vol;
    const src=ctx.createBufferSource(), flt=ctx.createBiquadFilter();
    flt.type='bandpass'; flt.frequency.value=s.freq; flt.Q.value=0.8;
    src.buffer=buf; src.connect(flt); flt.connect(ctx.destination); src.start();
  }catch(e){}
}
function renderFilters(){
  const wrap=document.getElementById('catFilters'); wrap.innerHTML='';
  ['all',...CATS].forEach(c=>{
    const btn=document.createElement('button');
    btn.className='btn btn-sm '+(activeCat===c?'btn-primary':'btn-outline');
    btn.textContent=c; btn.style.textTransform='capitalize';
    btn.addEventListener('click',()=>{ activeCat=c; renderFilters(); renderSounds(); });
    wrap.appendChild(btn);
  });
}
function renderSounds(){
  const grid=document.getElementById('soundGrid'); grid.innerHTML='';
  SOUNDS.filter(s=>activeCat==='all'||s.cat===activeCat).forEach(s=>{
    const card=document.createElement('div');
    card.className='sound-card'; card.id='sc-'+s.id;
    card.innerHTML=`<p class="sound-cat">[${s.cat}]</p><p class="sound-name">${s.label}</p><p class="sound-desc">${s.desc}</p><button class="play-btn" data-id="${s.id}">▶ Play</button>`;
    grid.appendChild(card);
  });
  grid.querySelectorAll('.play-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
      const s=SOUNDS.find(x=>x.id===this.dataset.id);
      if(!s) return;
      playSynth(s);
      document.getElementById('lastPlayed').textContent=s.label;
      const card=document.getElementById('sc-'+s.id);
      card.classList.add('playing'); this.classList.add('playing'); this.textContent='▶ Playing…';
      setTimeout(()=>{ card.classList.remove('playing'); this.classList.remove('playing'); this.textContent='▶ Play'; },900);
    });
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  renderFilters(); renderSounds();
  document.getElementById('volSlider').addEventListener('input',function(){ vol=parseFloat(this.value); document.getElementById('volLabel').textContent=Math.round(vol*100)+'%'; });
  document.getElementById('btnMuteAll').addEventListener('click',function(){ muted=!muted; this.textContent=muted?'🔇 Unmute':'🔊 Mute All'; });
});
</script>
</body>
</html>
