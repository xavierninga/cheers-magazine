<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Feature Flags — Cheers Dev</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/pages.css"/>
</head>
<body>
<div class="dev-topbar">
  <a href="index.html">← Dev Hub</a><span class="sep">|</span>
  <h1>🚩 Feature Flags</h1>
  <span class="dev-env-badge">DEV TOOL</span>
</div>
<div class="dev-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">
    <p style="font-size:.82rem;opacity:.45;max-width:480px;line-height:1.6">Overrides stored in <code style="font-family:var(--font-m)">sessionStorage</code> — reset when you close the tab. To change defaults permanently edit <code style="font-family:var(--font-m)">.env.local</code>.</p>
    <button class="btn btn-outline btn-sm" id="btnResetAll">Reset All to Default</button>
  </div>
  <div id="flagsList"></div>
</div>
<script src="../js/app.js"></script>
<script>
const FLAGS=[
  {key:'sounds',     icon:'🔊', label:'Sound Effects',      desc:'Page flip, hover, click and notification sounds'},
  {key:'animations', icon:'🎬', label:'Animations',         desc:'Page flip animations, transitions, micro-interactions'},
  {key:'antiPiracy', icon:'🛡️', label:'Anti-Piracy Overlay',desc:'Screen capture protection and copy prevention'},
  {key:'watermark',  icon:'💧', label:'User Watermark',     desc:'Invisible + visible user identity watermarks on pages'},
  {key:'fullscreen', icon:'⛶',  label:'Fullscreen Mode',    desc:'Immersive fullscreen reader toggle'},
  {key:'debugMode',  icon:'🐛', label:'Debug Mode',         desc:'FPS counter, render inspector, event log overlay'},
  {key:'payments',   icon:'💳', label:'Payment Flows',      desc:'Subscription and per-issue payment UI'},
];
function render(){
  const list=document.getElementById('flagsList'); list.innerHTML='';
  FLAGS.forEach(f=>{
    const on=FeatureFlags.get(f.key);
    const def=FeatureFlags._defaults[f.key];
    const overridden=on!==def;
    const card=document.createElement('div');
    card.className='flag-card'+(on?' on':'');
    card.innerHTML=`
      <div class="flag-info">
        <div class="flag-name">${f.icon} ${f.label}${overridden?'<span class="flag-override-badge">OVERRIDDEN</span>':''}</div>
        <div class="flag-desc">${f.desc}</div>
        <div class="flag-meta">default: ${def} &nbsp;·&nbsp; current: ${on}</div>
      </div>
      <button class="toggle-sw${on?' on':''}" data-key="${f.key}" aria-label="Toggle ${f.label}"><div class="toggle-knob"></div></button>`;
    list.appendChild(card);
  });
  list.querySelectorAll('.toggle-sw').forEach(btn=>{
    btn.addEventListener('click',function(){
      const k=this.dataset.key, v=!FeatureFlags.get(k);
      FeatureFlags.set(k,v); render();
    });
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  render();
  document.getElementById('btnResetAll').addEventListener('click',()=>{ FeatureFlags.reset(); render(); });
});
</script>
</body>
</html>
