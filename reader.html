<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Reader — Cheers Magazine</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/reader.css"/>
</head>
<body class="reader-body">

<div class="reader-wrap">

  <!-- TOP BAR -->
  <div class="reader-topbar">
    <a href="index.html" class="reader-back">← Home</a>
    <span class="reader-logo">CHEERS <span class="red">MAGAZINE</span></span>
    <span class="reader-info" id="readerTopInfo">— / —</span>
  </div>

  <!-- STAGE -->
  <div class="reader-stage">

    <!-- Loading -->
    <div class="reader-loading" id="readerLoading">
      <p id="loadMsg">Loading magazine…</p>
      <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
    </div>

    <!-- Empty / no PDF -->
    <div class="reader-empty" id="readerEmpty" style="display:none">
      <span style="font-size:3.5rem">📄</span>
      <h2>No Issue Loaded</h2>
      <p>Upload a PDF magazine to start reading. It only takes 30 seconds.</p>
      <a href="dev/pdf-upload.html" class="btn btn-primary" style="margin-top:.8rem">Upload PDF →</a>
    </div>

    <!-- Page viewer -->
    <div id="pageWrap" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;position:relative">
      <button class="page-arrow prev" id="btnPrev" aria-label="Previous page">&#8249;</button>

      <div class="page-book no-select" id="pageBook">
        <div class="watermark-layer" id="watermarkLayer"></div>
        <img class="page-img" id="pageImg" src="" alt="Magazine page" draggable="false" style="display:none"/>
        <div class="page-placeholder" id="pagePlaceholder">
          <span class="placeholder-num" id="placeholderNum">01</span>
          <span class="placeholder-label">CHEERS MAGAZINE</span>
        </div>
      </div>

      <button class="page-arrow next" id="btnNext" aria-label="Next page">&#8250;</button>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="reader-progress">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- CONTROLS -->
  <div class="reader-controls">
    <span class="ctrl-page" id="ctrlPage">1 / 1</span>
    <div class="ctrl-spacer"></div>
    <button class="ctrl-btn" id="btnZoomOut" title="Zoom out ( − )">−</button>
    <span class="ctrl-zoom-lbl" id="zoomLabel">100%</span>
    <button class="ctrl-btn" id="btnZoomIn"  title="Zoom in ( + )">+</button>
    <button class="ctrl-btn" id="btnZoomRst" title="Reset zoom ( 0 )" style="font-size:.6rem">RST</button>
    <button class="ctrl-btn" id="btnMute"    title="Toggle sound ( M )">🔊</button>
    <button class="ctrl-btn" id="btnFs"      title="Fullscreen ( F )">⛶</button>
    <button class="ctrl-btn" id="btnThumbs"  title="Thumbnails">⊞</button>
    <button class="ctrl-btn" id="btnUploadPdf" title="Upload PDF" style="font-size:.6rem;letter-spacing:.04em">PDF</button>
  </div>

  <!-- KEYBOARD HINTS -->
  <div class="kbd-hints">
    <span class="kbd-hint">← → Navigate</span>
    <span class="kbd-hint">+ − Zoom</span>
    <span class="kbd-hint">0 Reset</span>
    <span class="kbd-hint">F Fullscreen</span>
    <span class="kbd-hint">M Mute</span>
  </div>

  <!-- THUMBNAILS -->
  <div class="reader-thumbs" id="thumbsStrip"></div>

</div>

<script src="js/app.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
